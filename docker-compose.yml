version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: airiac_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airiac_db}
      POSTGRES_USER: ${POSTGRES_USER:-airiac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - airiac_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airiac} -d ${POSTGRES_DB:-airiac_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - airiac_network

  redis:
    image: redis:7-alpine
    container_name: airiac_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - airiac_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airiac_network

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airiac_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file: .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web,frontend,0.0.0.0}
      - DB_NAME=${DB_NAME:-airiac_db}
      - DB_USER=${DB_USER:-airiac}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_URL=${CACHE_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-Asia/Kolkata}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS:-False}
      - SIMPLE_JWT_ACCESS_TOKEN_LIFETIME_MINUTES=${SIMPLE_JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      - SIMPLE_JWT_REFRESH_TOKEN_LIFETIME_DAYS=${SIMPLE_JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      - USE_MOCK_DATA=${USE_MOCK_DATA:-True}
      - AIR_QUALITY_DATA_PROVIDER=${AIR_QUALITY_DATA_PROVIDER:-mock_cpcb}
      - WEATHER_DATA_PROVIDER=${WEATHER_DATA_PROVIDER:-mock_imd}
      - FIRMS_DATA_PROVIDER=${FIRMS_DATA_PROVIDER:-mock_firms}
      - TIME_ZONE=${TIME_ZONE:-Asia/Kolkata}
      - DEFAULT_CITY=${DEFAULT_CITY:-Chandigarh}
      - CHANDIGARH_BBOX_MIN_LAT=${CHANDIGARH_BBOX_MIN_LAT:-30.6500}
      - CHANDIGARH_BBOX_MAX_LAT=${CHANDIGARH_BBOX_MAX_LAT:-30.8200}
      - CHANDIGARH_BBOX_MIN_LNG=${CHANDIGARH_BBOX_MIN_LNG:-76.6800}
      - CHANDIGARH_BBOX_MAX_LNG=${CHANDIGARH_BBOX_MAX_LNG:-76.8800}
      - SKIP_MIGRATIONS=${SKIP_MIGRATIONS:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - airiac_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airiac_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - DB_NAME=${DB_NAME:-airiac_db}
      - DB_USER=${DB_USER:-airiac}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_URL=${CACHE_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-Asia/Kolkata}
      - SIMPLE_JWT_ACCESS_TOKEN_LIFETIME_MINUTES=${SIMPLE_JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      - SIMPLE_JWT_REFRESH_TOKEN_LIFETIME_DAYS=${SIMPLE_JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      - USE_MOCK_DATA=${USE_MOCK_DATA:-True}
      - AIR_QUALITY_DATA_PROVIDER=${AIR_QUALITY_DATA_PROVIDER:-mock_cpcb}
      - WEATHER_DATA_PROVIDER=${WEATHER_DATA_PROVIDER:-mock_imd}
      - FIRMS_DATA_PROVIDER=${FIRMS_DATA_PROVIDER:-mock_firms}
      - TIME_ZONE=${TIME_ZONE:-Asia/Kolkata}
      - DEFAULT_CITY=${DEFAULT_CITY:-Chandigarh}
      - CHANDIGARH_BBOX_MIN_LAT=${CHANDIGARH_BBOX_MIN_LAT:-30.6500}
      - CHANDIGARH_BBOX_MAX_LAT=${CHANDIGARH_BBOX_MAX_LAT:-30.8200}
      - CHANDIGARH_BBOX_MIN_LNG=${CHANDIGARH_BBOX_MIN_LNG:-76.6800}
      - CHANDIGARH_BBOX_MAX_LNG=${CHANDIGARH_BBOX_MAX_LNG:-76.8800}
      - SKIP_MIGRATIONS=true
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - airiac_network

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airiac_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - DB_NAME=${DB_NAME:-airiac_db}
      - DB_USER=${DB_USER:-airiac}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_URL=${CACHE_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-Asia/Kolkata}
      - SIMPLE_JWT_ACCESS_TOKEN_LIFETIME_MINUTES=${SIMPLE_JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      - SIMPLE_JWT_REFRESH_TOKEN_LIFETIME_DAYS=${SIMPLE_JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      - USE_MOCK_DATA=${USE_MOCK_DATA:-True}
      - AIR_QUALITY_DATA_PROVIDER=${AIR_QUALITY_DATA_PROVIDER:-mock_cpcb}
      - WEATHER_DATA_PROVIDER=${WEATHER_DATA_PROVIDER:-mock_imd}
      - FIRMS_DATA_PROVIDER=${FIRMS_DATA_PROVIDER:-mock_firms}
      - TIME_ZONE=${TIME_ZONE:-Asia/Kolkata}
      - DEFAULT_CITY=${DEFAULT_CITY:-Chandigarh}
      - CHANDIGARH_BBOX_MIN_LAT=${CHANDIGARH_BBOX_MIN_LAT:-30.6500}
      - CHANDIGARH_BBOX_MAX_LAT=${CHANDIGARH_BBOX_MAX_LAT:-30.8200}
      - CHANDIGARH_BBOX_MIN_LNG=${CHANDIGARH_BBOX_MIN_LNG:-76.6800}
      - CHANDIGARH_BBOX_MAX_LNG=${CHANDIGARH_BBOX_MAX_LNG:-76.8800}
      - SKIP_MIGRATIONS=true
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - airiac_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airiac_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file: .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      - VITE_APP_TITLE=${VITE_APP_TITLE:-Urban Air Quality Assistant (AIRiac Chandigarh)}
      - VITE_DEFAULT_LAT=${VITE_DEFAULT_LAT:-30.7333}
      - VITE_DEFAULT_LNG=${VITE_DEFAULT_LNG:-76.7794}
      - VITE_DEFAULT_ZOOM=${VITE_DEFAULT_ZOOM:-12}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - airiac_network

volumes:
  airiac_db_data:
    name: airiac_db_data
  airiac_redis_data:
    name: airiac_redis_data

networks:
  airiac_network:
    name: airiac_network
    driver: bridge
